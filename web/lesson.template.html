<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콕봇 · 두 버튼 복습</title><style>
:root{font-family:"Segoe UI","Malgun Gothic",sans-serif;color:#293a30;background:#f5f3ec}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:760px;margin:30px auto}header{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:12px;color:#7d8873}.logo{font-weight:800;color:#4b624c}.card{margin:26px 0;background:#fffef8;border:1px solid #dce0d2;border-radius:24px;padding:36px;box-shadow:0 6px 0 #e4e2d5}.label{font-size:11px;color:#839273;letter-spacing:1.5px}.pet{text-align:right;font:40px monospace;color:#c48e5d}h1{font-size:24px;line-height:1.6}h2{font-size:22px;line-height:1.6;white-space:pre-wrap}.choices{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:30px 0}button{font:inherit;border:1px solid #cbd5c1;border-radius:13px;padding:18px;background:#e8eddf;color:#374e35;cursor:pointer}button:hover{background:#dbe6d0}button:disabled{opacity:.65;cursor:default}.choice span{display:block;font-size:10px;margin-bottom:8px;color:#7b8c6c}#feedback{white-space:pre-wrap;line-height:1.9;padding:20px;border-radius:12px;background:#f1f1e7}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:12px;padding:11px}#hint,#notice,footer{font-size:12px;line-height:1.9;color:#7d8873}#notice{color:#a07849;min-height:20px}.progress{height:5px;background:#e5e9da;border-radius:5px;overflow:hidden;margin:16px 0}.progress i{height:100%;display:block;background:#759263;width:0}#badge{font-size:10px;padding:6px 10px;background:#ece8d8;border-radius:20px}[hidden]{display:none!important}button:focus-visible{outline:3px solid #dba56f;outline-offset:2px}@media(max-width:500px){body{padding:16px}.card{padding:22px}main{margin:10px auto}h1{font-size:21px}h2{font-size:19px}.choices{gap:10px}.choice{padding:14px 10px;overflow-wrap:anywhere}}
</style></head><body><main><header><span class="logo">콕봇 · 두 버튼 공부 친구</span><span id="badge">개인 학습 웹</span></header><h1 id="title"></h1><div class="progress"><i id="bar"></i></div><section class="card"><div class="label" id="progress"></div><div class="pet" aria-hidden="true" id="pet">▰ᴥ▰</div><h2 id="prompt"></h2><div class="choices"><button id="answer1" class="choice"><span>버튼 1</span><b id="choice1"></b></button><button id="answer2" class="choice"><span>버튼 2</span><b id="choice2"></b></button></div><div id="feedback" aria-live="polite" hidden></div><p id="hint">버튼 1 또는 2로 답을 골라 주세요. 키보드도 같은 숫자를 사용해요.</p><div class="actions"><button id="next" hidden>다음 문제 →</button><button id="restart" hidden>처음부터 다시</button></div></section><div class="actions"><button id="export">풀이 기록 저장</button></div><p id="notice" role="status"></p><footer>이 파일에는 문제와 화면이 함께 들어 있습니다. 서버 연결 없이 학습하고, 풀이 기록을 필요한 봇에게 전달하세요.</footer></main><script id="lesson-data" type="application/json">@@PACK_JSON@@</script><script>@@LESSON_SCRIPT@@</script></body></html>
