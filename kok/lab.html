<style>
:root{--bg:#EEF1F7;--card:#FAFBFE;--card2:#EDF1F8;--ink:#151B33;--sub:#424B6B;--dim:#5F6987;--line:#D7DCE8;--line2:#BCC5D8;--field:#FFFFFF;--track:#D9DFEC;--ledoff:#CBD2E2;--ledoff2:#B3BCD1;--overlay:rgba(21,27,51,.45);--onink:#FFFFFF;--shadow:0 1px 2px rgba(21,27,51,.06),0 4px 14px rgba(21,27,51,.06);

  --amber:#FBBF24;--ambers:rgba(251,191,36,.16);--red:#F87171;--reds:rgba(248,113,113,.18);--gold:#FFD76A;--golds:rgba(255,215,106,.18)}

<script>
(function(){
'use strict';

const $ = (id)=>document.getElementById(id);
(function(){ let t=''; try{ t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('kok_theme') || ''; }catch(e){} document.documentElement.dataset.theme = t==='dark' ? 'dark' : 'light'; })();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showErr(msg){ const e=$('err'); e.textContent = msg; e.classList.remove('hidden'); }
function clearErr(){ $('err').classList.add('hidden'); }
const inFrame = (function(){ try{ return window.parent && window.parent !== window; }catch(e){ return false; } })();
const hostWin = (function(){ try{ if(window.opener) return window.opener; }catch(e){} return inFrame ? window.parent : null; })();

/* ---------- 보드 키 전달: 실험실에 포커스가 있어도 1~4, Esc, Space가 표시 화면에 먹히게 ---------- */
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey||e.altKey||e.metaKey||e.repeat) return;
  const digit = /^(Digit|Numpad)[1-4]$/.test(e.code) ? e.code.slice(-1) : (/^[1-4]$/.test(e.key) ? e.key : '');
  if(digit || e.key==='Escape' || e.code==='Space'){
    const tag = (e.target && e.target.tagName) || '';
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag) && e.key!=='Escape') return;
    if(e.code==='Space' && /^(BUTTON|A|SUMMARY)$/.test(tag)) return; // 버튼에 포커스가 있으면 Space는 그 버튼을 누른다
    e.preventDefault();
    if(hostWin){ try{ hostWin.postMessage({type:'kok-key', key: digit || (e.key==='Escape'?'Escape':' '), code:e.code}, '*'); }catch(err){} }
  }
});

/* ---------- 식 계산 ---------- */
function compileExpr(expr, names){
  const src = String(expr==null?'0':expr);
  try{
    return new Function(names.join(','),
      '"use strict"; var abs=Math.abs,exp=Math.exp,log=Math.log,ln=Math.log,sqrt=Math.sqrt,sin=Math.sin,cos=Math.cos,tan=Math.tan,pow=Math.pow,min=Math.min,max=Math.max,PI=Math.PI; return ('+src+');'
    );
  }catch(e){ return null; }
}
function makeEval(lab){
  const varNames = (lab.variables||[]).map(v=>v.name).filter(Boolean);
  const outNames = (lab.outputs||[]).map(o=>o.name).filter(Boolean);
  const allNames = varNames.concat(outNames);
  if(allNames.indexOf('t')<0) allNames.push('t');
  const outFns = (lab.outputs||[]).map(o=>({name:o.name, fn: compileExpr(o.expr, allNames)}));
  return function evalAll(vars){
    const scope = Object.assign({}, vars);
    if(scope.t == null){ const tv = (lab.variables||[]).find(v=>v.name==='t'); scope.t = tv ? (Number(tv.value)||0) : 0; }
    for(const o of outFns){
      if(!o.name) continue;
      try{
        const args = allNames.map(n => scope[n] != null ? Number(scope[n]) : 0);
        const v = o.fn ? o.fn.apply(null, args) : NaN;
        scope[o.name] = (typeof v === 'number' && isFinite(v)) ? v : (typeof v === 'boolean' ? (v?1:0) : NaN);
      }catch(e){ scope[o.name] = NaN; }
    }
    return scope;
  };
}
function evalNum(expr, scope, names){
  if(typeof expr === 'number') return expr;
  if(expr == null || expr === '') return NaN;
  const fn = compileExpr(expr, names);
  if(!fn) return NaN;
  try{ const args = names.map(n => scope[n] != null ? Number(scope[n]) : 0); const v = fn.apply(null, args); return (typeof v === 'number' && isFinite(v)) ? v : NaN; }catch(e){ return NaN; }
}

/* ---------- 설계서 읽기 + 옛 형식(spec_schema.md) 정규화 ---------- */
function letterIndex(a){ if(typeof a==='number') return a; const s=String(a||'').trim().toUpperCase(); if(/^[A-Z]$/.test(s)) return s.charCodeAt(0)-65; const n=Number(s); return isFinite(n)?n:0; }
function normalizeLab(o){
  if(!o || typeof o!=='object') return o;
  const lab = Object.assign({}, o);
  if(lab.lab && typeof lab.lab==='object' && !lab.variables) return normalizeLab(lab.lab);
  if(lab.spec && typeof lab.spec==='object' && !lab.variables) return normalizeLab(lab.spec);
  lab.variables = (lab.variables||[]).map(v=>{
    if(!v) return v; const w=Object.assign({}, v);
    if(!w.name && w.symbol) w.name = w.symbol;
    if(w.value==null && w.default!=null) w.value = w.default;
    if(!w.label && w.display) w.label = w.display;
    return w;
  });
  if(!lab.outputs && Array.isArray(lab.formulas)) lab.outputs = lab.formulas.filter(f=>f&&f.expr).map(f=>({name:f.symbol||f.name, label:f.label||f.display||f.symbol, unit:f.unit||'', expr:f.expr}));
  if(!lab.graph && lab.plot && lab.plot.x){ const x=lab.plot.x; lab.graph = { x:{name:x.symbol||x.name||'t', label:x.label||'', unit:x.unit||'', min:x.min!=null?x.min:0, max:x.max!=null?x.max:10}, y:(lab.plot.y||[]).map(y=>({label:y.label||'', expr:y.expr, unit:y.unit||''})) }; }
  if(Array.isArray(lab.predict)) lab.predict = lab.predict[0] || null;
  if(lab.predict && !lab.predict.choices && lab.predict.options) lab.predict = Object.assign({}, lab.predict, {choices: lab.predict.options, answer_index: letterIndex(lab.predict.answer)});
  if(lab.predict && lab.predict.answer_index==null && lab.predict.answer!=null) lab.predict.answer_index = letterIndex(lab.predict.answer);
  if(Array.isArray(lab.challenge)) lab.challenge = lab.challenge.find(c=>c&&Array.isArray(c.options||c.choices)) || lab.challenge[0] || null;
  if(lab.challenge && !lab.challenge.choices && lab.challenge.options) lab.challenge = Object.assign({}, lab.challenge, {choices: lab.challenge.options, answer_index: letterIndex(lab.challenge.answer)});
  if(lab.challenge && lab.challenge.answer_index==null && lab.challenge.answer!=null && lab.challenge.choices) lab.challenge.answer_index = letterIndex(lab.challenge.answer);
  if(Array.isArray(lab.cover)) lab.cover = lab.cover.join('\n');
  if(!lab.scene){ const vs=lab.variables||[]; const bin = vs.length>=2 && vs.every(isBinaryVar); lab.scene = bin ? 'logic_gate' : (lab.graph ? 'rc_circuit' : 'generic'); if(bin && !lab.gate) lab.gate='AND'; }
  return lab;
}
function parseLooseJson(s){
  try{ return JSON.parse(s); }catch(e){}
  const m = String(s).match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }

async function loadLab(){
  if(location.hash.startsWith('#lab=')){
    try{ const b64 = location.hash.slice(5).replace(/-/g,'+').replace(/_/g,'/'); const o = JSON.parse(decodeURIComponent(escape(atob(b64)))); if(o && typeof o==='object') return o; }catch(e){}
  }
  for(const store of [sessionStorage, localStorage]){
    try{ const raw = store.getItem('kok_lab'); if(raw){ const o = JSON.parse(raw); if(o && typeof o==='object') return o; } }catch(e){}
  }
  const sp = new URLSearchParams(location.search);
  const id = sp.get('id');
  if(id && /^https?:/.test(location.protocol)){
    try{
      const key = '그록봇 빌드데이/결과/'+id+'.json';
      const r = await fetch('/api/dl?key='+encodeURIComponent(key)+'&inline=1', {cache:'no-store'});
      if(r.ok){ const obj = await r.json(); if(obj && (obj.lab||obj.spec)) return obj.lab||obj.spec; }
    }catch(e){}
  }
  try{ const r = await fetch('example_result.json', {cache:'no-store'}); if(r.ok){ const o = await r.json(); if(o.lab) return o.lab; } }catch(e){}
  return null;
}
function isBinaryVar(v){
  if(!v) return false;
  const min = Number(v.min), max = Number(v.max), step = Number(v.step);
  return min === 0 && max === 1 && (step === 1 || step === 0 || !isFinite(step));
}

function webglOk(){
  try{
    const probe = document.createElement('canvas');
    const gl = probe.getContext('webgl2') || probe.getContext('webgl') || probe.getContext('experimental-webgl');
    if(!gl) return false;
    const ext = gl.getExtension('WEBGL_lose_context'); if(ext) ext.loseContext(); // 확인용 컨텍스트는 바로 돌려준다
    return true;
  }catch(e){ return false; }
}
function initThree(host){

  renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio||1));
  renderer.setSize(w, h, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if(renderer.outputColorSpace !== undefined && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  host.insertBefore(renderer.domElement, host.firstChild);
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b0f1d, 9, 20);
  camera = new THREE.PerspectiveCamera(fitFov(w/h), w/h, 0.1, 100);
  camera.position.set(-0.2, 3.1, 10.0);
  camera.lookAt(-0.1, 1.0, 0);
  scene.add(new THREE.AmbientLight(0xb8c4ff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0); dir.position.set(3,6,4); dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024); dir.shadow.camera.left=-6; dir.shadow.camera.right=6; dir.shadow.camera.top=6; dir.shadow.camera.bottom=-6;
  scene.add(dir);
  const rim = new THREE.DirectionalLight(0x4c8dff, 0.45); rim.position.set(-4,3,-3); scene.add(rim);
  raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();

  if(!resizeBound){ resizeBound=true; window.addEventListener('resize', ()=>{ if(!renderer||!camera) return; const w2=host.clientWidth, h2=host.clientHeight; if(!w2||!h2) return; camera.aspect=w2/h2; camera.fov=fitFov(w2/h2); camera.updateProjectionMatrix(); renderer.setSize(w2,h2,false); needRender=true; }); }

// 장면 가로폭(약 9.4단위)이 어떤 화면 비율에서도 다 보이게 세로 시야각을 맞춘다
function fitFov(aspect){ const d=10.2, half=5.15; const v = 2*Math.atan(half/(d*Math.max(0.5,aspect)))*180/Math.PI; return Math.max(24, Math.min(52, v)); }
function mat(color, emissive, ei, rough){ return new THREE.MeshStandardMaterial({color: color||0xe9e3d6, emissive: emissive||0x000000, emissiveIntensity: ei==null?0.2:ei, roughness: rough==null?0.5:rough, metalness: 0.15}); }
function addPick(mesh, info){ mesh.userData.info = info; pickables.push(mesh); }
function hitObj(ev){
  if(!renderer) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((ev.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, true);
  if(!hits.length) return null;
  let obj = hits[0].object;
  while(obj && !obj.userData.info && obj.parent) obj = obj.parent;
  return obj && obj.userData.info ? obj : null;
}
function onHover3d(ev){ const o = hitObj(ev); renderer.domElement.style.cursor = o && o.userData.toggle ? 'pointer' : 'default'; }
function onPick3d(ev){
  const obj = hitObj(ev);
  if(!obj){ tipEl.style.display='none'; return; }
  if(obj.userData.toggle){ obj.userData.toggle(); return; }
  const info = obj.userData.info;
  tipEl.style.display='block'; tipEl.textContent = typeof info==='function'?info():info;
}
function gateExprFallback(gate, A, B){
  const g = String(gate||'AND').toUpperCase();
  const a = A>=1?1:0, b = B>=1?1:0;
  if(g==='OR') return (a||b)?1:0;
  if(g==='NOT') return a?0:1;
  if(g==='XOR') return (a^b)?1:0;
  if(g==='NAND') return (a&&b)?0:1;
  if(g==='NOR') return (a||b)?0:1;
  return (a&&b)?1:0;
}
function labelSprite(text, color, scale){
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  const g = c.getContext('2d');
  g.fillStyle='rgba(10,14,30,0.78)'; roundRect(g, 6, 14, 500, 100, 28); g.fill();
  g.strokeStyle=color||'#b3bcd9'; g.lineWidth=5; roundRect(g, 6, 14, 500, 100, 28); g.stroke();
  g.fillStyle='#f4f6ff'; g.font='bold 56px "Pretendard","Malgun Gothic",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(c); if(THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  const s = scale||1; sp.scale.set(1.9*s, 0.475*s, 1);
  return sp;
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
}
function tubeAlong(points, radius, material){
  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],p[2])), false, 'catmullrom', 0.0);
  const geo = new THREE.TubeGeometry(curve, 48, radius, 10, false);
  const m = new THREE.Mesh(geo, material); m.castShadow=true; m.userData.curve = curve; return m;
}

    const lab = labelSprite('스위치 '+name, '#a78bfa', 0.9); lab.position.set(0, 1.35, 0); g.add(lab);
    const val = labelSprite(name+' = 0', '#6f7ba3', 0.7); val.position.set(0, -0.05, 0.9); g.add(val);
    addPick(g, ()=>{ const s=getScope(); return '스위치 '+name+' = '+(s[name]>=1?1:0); });
    g.userData.toggle = ()=> onToggle(name);
    g.userData.lever = lever; g.userData.ring = ring; g.userData.val = val;
    scene.add(g);
    return g;
  }
  const swA = makeSwitch(1.9, 'A');
  const swB = makeSwitch(-1.9, 'B');

  // 게이트 (D자: 상자 + 반원기둥)
  const gate = new THREE.Group();
  const gm = mat(0x4c8dff, 0x0a2a6a, 0.25, 0.45);
  const dShape = new THREE.Shape();
  dShape.moveTo(-0.6,-0.75); dShape.lineTo(0.05,-0.75); dShape.absarc(0.05,0,0.75,-Math.PI/2,Math.PI/2,false); dShape.lineTo(-0.6,0.75); dShape.closePath();
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(dShape, {depth:0.5, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.04, bevelSegments:2, curveSegments:24}), gm);
  body.position.z=-0.25; body.castShadow=true;
  gate.add(body);
  const glabel = labelSprite(gateType, '#4c8dff', 0.95); glabel.position.set(0.2, 0.0, 0.5); gate.add(glabel);
  const gtitle = labelSprite(gateType+' 게이트', '#4c8dff', 0.9); gtitle.position.set(0.2, 1.35, 0); gate.add(gtitle);
  gate.position.set(0.2, 0.9, 0);
  addPick(gate, ()=>{ const s=getScope(); return gateType+' 게이트 · F='+(s.F!=null?s.F:'?'); });
  scene.add(gate);

  // 전선 (튜브) + 흐르는 점
  const wireOff = ()=> mat(offC, 0x000000, 0, 0.7);
  const wA = tubeAlong([[-2.65,0.55,1.9],[-1.7,0.55,1.9],[-1.0,0.6,0.8],[-0.35,0.65,0.0]], 0.06, wireOff()); scene.add(wA);
  const wB = tubeAlong([[-2.65,0.55,-1.9],[-1.7,0.55,-1.9],[-1.0,0.95,-0.8],[-0.35,1.15,0.0]], 0.06, wireOff()); scene.add(wB);
  const wF = tubeAlong([[1.5,0.9,0],[2.9,0.95,0]], 0.06, wireOff()); scene.add(wF);
  const dots = [];
  function makeDots(wire, n){ const arr=[]; for(let i=0;i<n;i++){ const d=new THREE.Mesh(new THREE.SphereGeometry(0.075,10,10), new THREE.MeshBasicMaterial({color:0x9bffd9})); d.visible=false; d.userData.u=i/n; d.userData.wire=wire; scene.add(d); arr.push(d); } return arr; }
  dots.push(...makeDots(wA,5), ...makeDots(wB,5), ...makeDots(wF,3));

  // 전구
  const bulb = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.SphereGeometry(0.55,32,32), new THREE.MeshStandardMaterial({color:0x2b3350, emissive:0x111111, emissiveIntensity:0.3, transparent:true, opacity:0.92, roughness:0.2, metalness:0.0}));
  glass.castShadow=true;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,0.35,20), mat(0xb9b0a2)); neck.position.y=-0.65;
  const baseB = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.34,0.3,20), mat(0x6f7ba3)); baseB.position.y=-0.95;
  const filament = new THREE.Mesh(new THREE.TorusGeometry(0.16,0.02,6,24), new THREE.MeshBasicMaterial({color:0x553300})); filament.rotation.x=Math.PI/2; filament.position.y=-0.1;

  const pool = new THREE.Mesh(new THREE.CircleGeometry(1.6, 40), new THREE.MeshBasicMaterial({color:0xffd76a, transparent:true, opacity:0, depthWrite:false}));
  pool.rotation.x=-Math.PI/2; pool.position.set(3.4,0.01,0); scene.add(pool);

  function haloTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=g.createRadialGradient(128,128,10,128,128,128); r.addColorStop(0,'rgba(255,215,106,0.9)'); r.addColorStop(0.4,'rgba(255,215,106,0.35)'); r.addColorStop(1,'rgba(255,215,106,0)'); g.fillStyle=r; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); }
  function setLabel(sprite, text, color){ if(sprite.userData.t===text) return; sprite.userData.t=text; const n = labelSprite(text, color, 0.7); sprite.material.map.dispose(); sprite.material.map = n.material.map; sprite.material.needsUpdate=true; }
  const setW = (mesh, on)=>{ mesh.material.color.set(on?onC:offC); mesh.material.emissive.set(on?0x0f6b4a:0x000000); mesh.material.emissiveIntensity = on?0.9:0; };
  let lastA=-1,lastB=-1,lastF=-1, pulseT=0, firstAt=performance.now();
  let glow = 0; // 0..1 전구 밝기(부드럽게)
  sceneState.anim = true;
  sceneState._update = (s, dt)=>{
    const A = s.A>=1?1:0, B = s.B>=1?1:0;
    let F = s.F; if(F==null || !isFinite(F)) F = gateExprFallback(gateType, A, B);
    F = F>=1?1:0;
    const target = {A:A?-0.55:0.55, B:B?-0.55:0.55};
    // 레버는 부드럽게
    let moving=false;
    [[swA,'A'],[swB,'B']].forEach(([sw,n])=>{ const lv=sw.userData.lever; const d=target[n]-lv.rotation.z; if(Math.abs(d)>0.005){ lv.rotation.z += d*Math.min(1, dt*14); moving=true; } else lv.rotation.z=target[n]; lv.material.color.set(s[n]>=1?onC:0x6f7ba3); lv.material.emissive.set(s[n]>=1?0x0f6b4a:0x000000); lv.material.emissiveIntensity=s[n]>=1?0.6:0; });
    if(A!==lastA||B!==lastB||F!==lastF){
      setW(wA,A); setW(wB,B); setW(wF,F);
      setLabel(swA.userData.val, 'A = '+A, A?'#34d399':'#6f7ba3'); setLabel(swB.userData.val, 'B = '+B, B?'#34d399':'#6f7ba3'); setLabel(bval, 'F = '+F, F?'#ffd76a':'#6f7ba3');
      dots.forEach(d=>{ const on = d.userData.wire===wA?A: d.userData.wire===wB?B:F; d.visible=!!on; });
      lastA=A; lastB=B; lastF=F;
    }
    const gTarget = F?1:0; const gd = gTarget-glow; if(Math.abs(gd)>0.004){ glow += gd*Math.min(1, dt*6); moving=true; } else glow=gTarget;
    glass.material.emissive.set(0xffd76a); glass.material.emissiveIntensity = 0.1 + 1.6*glow;
    glass.material.color.setRGB(0.17+0.83*glow, 0.2+0.75*glow, 0.31+0.45*glow);
    filament.material.color.setRGB(0.33+0.67*glow, 0.2+0.7*glow, 0.0+0.4*glow);
    light.intensity = 3.2*glow; halo.material.opacity = 0.85*glow; pool.material.opacity = 0.22*glow;
    // 흐르는 점
    const anyOn = A||B||F;
    if(anyOn){ pulseT += dt*0.6; dots.forEach(d=>{ if(!d.visible) return; const u=(d.userData.u+pulseT)%1; d.position.copy(d.userData.wire.userData.curve.getPointAt(u)); }); }
    // 처음 6초 스위치 링 맥동

    const ringOp = age<6 ? (0.35+0.35*Math.sin(age*5)) : 0;
    swA.userData.ring.material.opacity = ringOp; swB.userData.ring.material.opacity = ringOp;
    return moving || anyOn || age<6;
  };
}

let orbit = true, orbitT = 0;
const CAM0 = {x:-0.2, y:3.1, z:10.0};
let lastFrame = 0;
function start3dLoop(getScope){
  lastFrame = performance.now();
  const loop = (now)=>{
    animId = requestAnimationFrame(loop);
    if(document.hidden) return;
    const dt = Math.min(0.1, (now-lastFrame)/1000); lastFrame = now;
    let keep = false;
    if(sceneState._update){ try{ keep = !!sceneState._update(getScope(), dt); }catch(e){} }
    if(camera){ if(orbit && !predicted){ orbitT += dt; const a = Math.sin(orbitT*0.35)*0.28; camera.position.set(CAM0.x + Math.sin(a)*10.2, CAM0.y + 0.4*Math.sin(orbitT*0.5), CAM0.z*Math.cos(a)); camera.lookAt(-0.1, 1.0, 0); keep = true; } else if(orbit){ orbit = false; camera.position.set(CAM0.x, CAM0.y, CAM0.z); camera.lookAt(-0.1, 1.0, 0); keep = true; } }
    if((needRender || keep) && renderer&&scene&&camera){ renderer.render(scene, camera); needRender=false; }
  };
  animId = requestAnimationFrame(loop);
}

function drawGraph(){
  const canvas = $('graph'); const g = lab.graph;
  if(!g || !g.x || !Array.isArray(g.y) || !g.y.length){ canvas.classList.add('hidden'); return; }
  canvas.classList.remove('hidden');
  const ctx = canvas.getContext('2d'); const W=canvas.width, H=canvas.height;
  const cs=getComputedStyle(document.documentElement); ctx.clearRect(0,0,W,H); ctx.fillStyle=cs.getPropertyValue('--field').trim()||'#fff'; ctx.fillRect(0,0,W,H);
  const xDef=g.x, ys=g.y; const scope0=getScope();
  const xmin=evalNum(xDef.min!=null?xDef.min:0, scope0, names);
  let xmax=evalNum(xDef.max!=null?xDef.max:10, scope0, names);
  if(!(xmax>xmin)) xmax=xmin+10;
  const pad={l:52,r:16,t:14,b:30};
  const colors=['#a78bfa','#fbbf24','#4c8dff','#34d399'];
  const N=120;
  const series=ys.map((y,i)=>{ const pts=[]; for(let k=0;k<=N;k++){ const x=xmin+(xmax-xmin)*k/N; const local=Object.assign({}, vars); local[xDef.name||'t']=x; const sc=evalAll(local); pts.push({x,y:evalNum(y.expr, sc, names)}); } return {pts,label:y.label||('y'+i),color:colors[i%colors.length]}; });
  let ymin=Infinity,ymax=-Infinity;
  series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p.y)){ ymin=Math.min(ymin,p.y); ymax=Math.max(ymax,p.y);} }));
  if(!isFinite(ymin)||!isFinite(ymax)){ ymin=0; ymax=1; } if(ymax===ymin){ ymax+=1; ymin-=1; }
  const ypad=(ymax-ymin)*0.08; ymin-=ypad; ymax+=ypad;
  const X=x=>pad.l+(x-xmin)/(xmax-xmin)*(W-pad.l-pad.r); const Y=y=>pad.t+(1-(y-ymin)/(ymax-ymin))*(H-pad.t-pad.b);
  ctx.strokeStyle=cs.getPropertyValue('--line').trim()||'#e3e8f2'; ctx.lineWidth=1;
  for(let i=0;i<5;i++){ const yy=pad.t+(H-pad.t-pad.b)*i/4; ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke(); }
  ctx.fillStyle=cs.getPropertyValue('--sub').trim()||'#424b6b'; ctx.font='bold 16px sans-serif'; ctx.fillText((xDef.label||xDef.name||'t')+(xDef.unit?' ('+xDef.unit+')':''), W-pad.r-120, H-8);
  series.forEach((s,i)=>{ ctx.strokeStyle=s.color; ctx.lineWidth=3; ctx.beginPath(); let started=false; s.pts.forEach(p=>{ if(!isFinite(p.y)){started=false;return;} const xx=X(p.x),yy=Y(p.y); if(!started){ctx.moveTo(xx,yy);started=true;} else ctx.lineTo(xx,yy); }); ctx.stroke(); ctx.fillStyle=s.color; ctx.fillText(s.label, pad.l+8+i*140, pad.t+18); });
}

function coverText(){
  if(lab.cover) return lab.cover;
  const s=getScope(); const parts=[];
  if((lab.scene||'').toLowerCase()==='logic_gate'){
    const A=s.A>=1?1:0, B=s.B>=1?1:0; let F=s.F; if(F==null||!isFinite(F)) F=gateExprFallback(gateType,A,B); F=F>=1?1:0;
    parts.push('지금 A = '+A+', B = '+B+' 이니까 F = '+F+' ('+(F?'전구 켜짐':'전구 꺼짐')+').');
    const g=gateType; const rule = g==='AND'?'AND는 두 입력이 모두 1일 때만 1이다. 하나라도 0이면 0.' : g==='OR'?'OR은 하나라도 1이면 1이다.' : g==='XOR'?'XOR은 두 입력이 다를 때만 1이다.' : g==='NAND'?'NAND는 AND의 반대다. 둘 다 1일 때만 0.' : g==='NOR'?'NOR은 OR의 반대다. 둘 다 0일 때만 1.' : '';
    if(rule) parts.push(rule);

  for(let i=1;i<=4;i++) setChip(i,'');
  setChip(1,'act'); showStep(1); $('stampWrap').classList.remove('on'); $('cover').classList.remove('open'); $('cover').textContent='덮개 들추기'; $('btnToCover').disabled=true; $('btnToChal').disabled=true; $('predictWhy').classList.add('hidden'); $('btnPredict').disabled=true;
  $('m1').classList.remove('done'); $('m2').classList.remove('done'); $('doneBar').classList.remove('show');
  $('ttl').textContent = lab.title || '실험실';
  $('concept').textContent = lab.concept || '';
  if(lab.formula){ $('formula').hidden=false; $('formula').textContent=lab.formula; } else $('formula').hidden=true;
  gateType = String(lab.gate||'AND').toUpperCase();
  $('m2t').textContent = (lab.scene||'').toLowerCase()==='logic_gate' ? '전구가 켜지는(F = 1) 경우 찾기' : '출력이 바뀌는 것 보기';
  vars={};
  (lab.variables||[]).forEach(v=>{ if(!v||!v.name) return; let val = v.value!=null?Number(v.value):Number(v.default); if(!isFinite(val)) val=Number(v.min)||0; vars[v.name]=val; });
  names=(lab.variables||[]).map(v=>v&&v.name).filter(Boolean).concat((lab.outputs||[]).map(o=>o&&o.name).filter(Boolean));
  if(names.indexOf('t')<0) names.push('t');
  evalAll = makeEval(lab);
  $('view').classList.add('dimmed'); $('viewHint').textContent='먼저 오른쪽에서 예측을 고르세요'; $('viewHint').classList.remove('hide'); $('ctrlHint').textContent='(예측을 확정하면 열려요)';
  buildScene(lab.scene||'generic', getScope, onToggleVar);
  renderSliders(); refreshNums(); drawGraph(); updateTruth();
  bindPredict(); bindChallenge();
  try{ if(hostWin) hostWin.postMessage({type:'lab-rendered', ok:true, title: lab.title||''}, '*'); }catch(e){}
}
window.addEventListener('message', (e)=>{
  if(e.origin !== location.origin && e.origin !== 'null') return;
  const d = e.data || {};
  if(d.type==='lab-spec' && d.spec){ let s=d.spec; if(typeof s==='string'){ s=parseLooseJson(s); } if(s && typeof s==='object'){ const key=JSON.stringify(s); if(key!==window.__lastSpecKey){ window.__lastSpecKey=key; applyLab(s); } } }
  else if(d.type==='lab-dispose'){ clearView($('view')); }
});
window.addEventListener('pagehide', ()=>{ clearView($('view')); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) needRender=true; });

async function boot(){
  let raw=null;
  try{ raw = await loadLab(); }catch(e){ showErr('설계서를 읽지 못했습니다: '+(e.message||e)); }
  if(raw){ window.__lastSpecKey = JSON.stringify(raw); }
  applyLab(raw);
  try{ if(hostWin) hostWin.postMessage({type:'lab-ready'}, '*'); }catch(e){}
}
if(typeof THREE==='undefined'){ let n=0; const iv=setInterval(()=>{ if(typeof THREE!=='undefined' || ++n>40){ clearInterval(iv); boot(); } }, 100); } else boot();
})();
</script>
</body>
</html>
